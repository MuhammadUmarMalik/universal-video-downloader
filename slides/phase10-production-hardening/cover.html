<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Phase 10 Production Hardening</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #FFFFFF; color: #1A1A3A; font-family: Arial, Helvetica, sans-serif; display: grid; grid-template-columns: 1fr 310px; grid-template-rows: 1fr 96px; }
    .title-zone { border: 8px solid #1A1A3A; border-right: 0; padding: 78px 72px 0 78px; display: flex; flex-direction: column; justify-content: space-between; min-height: 624px; }
    .eyebrow { color: #FF5A00; font: 700 18px/1.2 "Courier New", monospace; letter-spacing: 2px; text-transform: uppercase; }
    h1 { max-width: 780px; font-size: 68px; line-height: 0.94; letter-spacing: -3px; font-weight: 900; }
    .subtitle { max-width: 680px; font: 400 22px/1.35 "Courier New", monospace; color: #2D2D2D; margin-top: 26px; }
    .product { font: 700 18px/1.3 "Courier New", monospace; color: #2D2D2D; padding-bottom: 38px; }
    .status-zone { border: 8px solid #1A1A3A; padding: 46px 34px; display: flex; flex-direction: column; justify-content: space-between; min-height: 624px; }
    .status-label { font: 700 15px/1.25 "Courier New", monospace; text-transform: uppercase; letter-spacing: 1px; color: #2D2D2D; }
    .status-value { font-size: 34px; font-weight: 900; line-height: 0.98; letter-spacing: -1px; color: #FF5A00; }
    .rule { height: 8px; background: #FF5A00; width: 100%; }
    .meta { font: 400 15px/1.45 "Courier New", monospace; color: #2D2D2D; }
    .bottom { grid-column: 1 / -1; background: #FF5A00; border-top: 8px solid #1A1A3A; padding: 25px 78px 0 78px; display: flex; align-items: flex-start; justify-content: space-between; color: #FFFFFF; }
    .bottom strong { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
    .bottom span { font: 700 15px/1.2 "Courier New", monospace; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <section class="title-zone">
      <div>
        <div class="eyebrow">Release assurance report</div>
        <h1>Phase 10<br>Production<br>Hardening</h1>
        <p class="subtitle">Native recovery, security gate, and release readiness.</p>
      </div>
      <div class="product">UNIVERSAL MEDIA DOWNLOADER&nbsp;&nbsp;|&nbsp;&nbsp;0.1.0</div>
    </section>
    <aside class="status-zone">
      <div>
        <div class="status-label">Scope</div>
        <div class="rule" style="margin-top:16px;"></div>
      </div>
      <div class="status-value">RECOVERY<br>SECURITY<br>RELEASE</div>
      <div class="meta">LOCAL-FIRST<br>RUST-OWNED<br>FAIL-CLOSED</div>
    </aside>
    <footer class="bottom">
      <strong>Production hardening evidence</strong>
      <span>Linux release verification</span>
    </footer>
  </div>
</body>
</html>
