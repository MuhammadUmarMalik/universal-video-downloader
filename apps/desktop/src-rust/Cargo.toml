[package]
name = "universal-media-downloader"
version = "0.1.0"
description = "Local-first Universal Media Downloader desktop core"
authors = ["Universal Media Downloader contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "universal_media_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
async-trait = "0.1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = "3"
